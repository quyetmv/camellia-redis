apiVersion: v1
kind: Service
metadata:
  name: svc-camellia-proxy-standalone-shared-auth
  labels:
    app.kubernetes.io/name: camellia-proxy
    app.kubernetes.io/component: metrics
    camellia_topology: shared-auth
    monitoring.camellia.io/enabled: 'true'
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '16379'
    prometheus.io/path: /prometheus
spec:
  type: NodePort
  sessionAffinity: None
  ports:
  - name: redis
    port: 6380
    targetPort: 6380
    nodePort: 30680
  - name: console
    port: 16379
    targetPort: 16379
    nodePort: 30679
  selector:
    app: camellia-proxy-standalone-shared-auth
