apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-camellia-proxy-standalone-key-routing
  labels:
    app: camellia-proxy-standalone-key-routing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: camellia-proxy-standalone-key-routing
  template:
    metadata:
      labels:
        app: camellia-proxy-standalone-key-routing
    spec:
      enableServiceLinks: false
      containers:
      - name: container-camellia
        image: 48n6e/camellia-redis-proxy:1.4.0-jdk-21-0.0.1
        command:
        - java
        - -XX:+UseG1GC
        - -XX:+UseContainerSupport
        - -Dio.netty.tryReflectionSetAccessible=true
        - --add-opens
        - java.base/java.lang=ALL-UNNAMED
        - --add-opens
        - java.base/java.io=ALL-UNNAMED
        - --add-opens
        - java.base/java.math=ALL-UNNAMED
        - --add-opens
        - java.base/java.net=ALL-UNNAMED
        - --add-opens
        - java.base/java.nio=ALL-UNNAMED
        - --add-opens
        - java.base/java.security=ALL-UNNAMED
        - --add-opens
        - java.base/java.text=ALL-UNNAMED
        - --add-opens
        - java.base/java.time=ALL-UNNAMED
        - --add-opens
        - java.base/java.util=ALL-UNNAMED
        - --add-opens
        - java.base/jdk.internal.access=ALL-UNNAMED
        - --add-opens
        - java.base/jdk.internal.misc=ALL-UNNAMED
        - --add-opens
        - java.base/sun.net.util=ALL-UNNAMED
        - -Xms128m
        - -Xmx1024m
        - -server
        - org.springframework.boot.loader.launch.JarLauncher
        resources:
          requests:
            memory: 128Mi
            cpu: 250m
          limits:
            memory: 1Gi
            cpu: '1'
        ports:
        - containerPort: 6380
          name: redis
          protocol: TCP
        - containerPort: 16379
          name: console
          protocol: TCP
        env:
        - name: LOGGING_LEVEL_ROOT
          value: INFO
        - name: LOGGING_LEVEL_COM_NETEASE_NIM_CAMELLIA_REDIS_PROXY
          value: INFO
        volumeMounts:
        - name: cm-db-camellia
          mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/camellia-redis-proxy.properties
          subPath: camellia-redis-proxy-standalone-key-routing.properties
        - name: cm-db-camellia
          mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/logback.xml
          subPath: logback.xml
        - name: cm-db-camellia
          mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/resource-key-routing.json
          subPath: resource-key-routing.json
      volumes:
      - name: cm-db-camellia
        configMap:
          name: cm-db-camellia
