apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-db-camellia
  labels:
    app: camellia-proxy-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: camellia-proxy-deploy
  template:
    metadata:
      labels:
        app: camellia-proxy-deploy
    spec:
      enableServiceLinks: false
      containers:
        - name: container-camellia
          image: 48n6e/camellia-redis-proxy:1.3.7-jdk-21-0.0.1
          command:
            - java
            - "-XX:+UseG1GC"
            - "-XX:+UseContainerSupport"
            - "-Dio.netty.tryReflectionSetAccessible=true"
            - "--add-opens"
            - "java.base/java.lang=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.io=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.math=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.net=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.nio=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.security=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.text=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.time=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.util=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/jdk.internal.access=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/jdk.internal.misc=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/sun.net.util=ALL-UNNAMED"
            - "-Xms128m"
            - "-Xmx1024m"
            - "-server"
            - "org.springframework.boot.loader.JarLauncher"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          ports:
            - containerPort: 6380
              name: redis
              protocol: TCP
            - containerPort: 16379
              name: console
              protocol: TCP
          volumeMounts:
            - name: cm-db-camellia
              mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/application.yml
              subPath: application.yml
            - name: cm-db-camellia
              mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/logback.xml
              subPath: logback.xml
            - name: cm-db-camellia
              mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/resource-table.json
              subPath: resource-table.json
      volumes:
        - name: cm-db-camellia
          configMap:
            name: cm-db-camellia
