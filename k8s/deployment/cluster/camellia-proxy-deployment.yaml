apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-camellia-proxy-cluster
  labels:
    app: camellia-proxy-cluster
spec:
  replicas: 3
  selector:
    matchLabels:
      app: camellia-proxy-cluster
  template:
    metadata:
      labels:
        app: camellia-proxy-cluster
    spec:
      enableServiceLinks: false
      containers:
      - name: container-camellia
        image: 48n6e/camellia-redis-proxy:1.3.7-jdk-21-0.0.1
        command:
        - java
        - -XX:+UseG1GC
        - -XX:+UseContainerSupport
        - -Dio.netty.tryReflectionSetAccessible=true
        - --add-opens
        - java.base/java.lang=ALL-UNNAMED
        - --add-opens
        - java.base/java.io=ALL-UNNAMED
        - --add-opens
        - java.base/java.math=ALL-UNNAMED
        - --add-opens
        - java.base/java.net=ALL-UNNAMED
        - --add-opens
        - java.base/java.nio=ALL-UNNAMED
        - --add-opens
        - java.base/java.security=ALL-UNNAMED
        - --add-opens
        - java.base/java.text=ALL-UNNAMED
        - --add-opens
        - java.base/java.time=ALL-UNNAMED
        - --add-opens
        - java.base/java.util=ALL-UNNAMED
        - --add-opens
        - java.base/jdk.internal.access=ALL-UNNAMED
        - --add-opens
        - java.base/jdk.internal.misc=ALL-UNNAMED
        - --add-opens
        - java.base/sun.net.util=ALL-UNNAMED
        - -Xms128m
        - -Xmx8192m
        - -server
        - org.springframework.boot.loader.JarLauncher
        resources:
          requests:
            memory: 100Mi
            cpu: '1'
          limits:
            memory: 8Gi
            cpu: '4'
        ports:
        - containerPort: 6380
          name: redis
          protocol: TCP
        - containerPort: 16378
          name: console
          protocol: TCP
        - containerPort: 16380
          name: cport
          protocol: TCP
        volumeMounts:
        - name: cm-db-camellia
          mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/application.yml
          subPath: application-cluster.yml
        - name: cm-db-camellia
          mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/logback.xml
          subPath: logback.xml
        - name: cm-db-camellia
          mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/resource-sharding-singlewrite-multiread.json
          subPath: resource-sharding-singlewrite-multiread.json
      volumes:
      - name: cm-db-camellia
        configMap:
          name: cm-db-camellia
