apiVersion: apps/v1
kind: Deployment
metadata:
  name: camellia-dashboard-redis
  labels:
    app: camellia-dashboard-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camellia-dashboard-redis
  template:
    metadata:
      labels:
        app: camellia-dashboard-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          ports:
            - containerPort: 6379
              name: redis
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: camellia-dashboard-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: camellia-dashboard-redis
