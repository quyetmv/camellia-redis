apiVersion: apps/v1
kind: Deployment
metadata:
  name: camellia-dashboard-mysql
  labels:
    app: camellia-dashboard-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camellia-dashboard-mysql
  template:
    metadata:
      labels:
        app: camellia-dashboard-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --default-authentication-plugin=mysql_native_password
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: camellia-dashboard-secret
                  key: mysql-root-password
            - name: MYSQL_DATABASE
              value: camellia
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          ports:
            - containerPort: 3306
              name: mysql
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: camellia-dashboard-mysql
spec:
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: camellia-dashboard-mysql
