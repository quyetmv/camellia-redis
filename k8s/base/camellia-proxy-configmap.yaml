  # mỗi service auth bằng password riêng; key routing theo hash/tag trong từng tenant route
  # ======================
  camellia-redis-proxy-cluster-shared-auth-key-routing.properties: |-
    port=6380
    application.name=camellia-redis-proxy-cluster-shared-auth-key-routing
    proxy.mode=cluster
    proxy.cluster.mode.enable=true
    cluster.mode.provider.class.name=com.netease.nim.camellia.redis.proxy.cluster.provider.ConsensusClusterModeProvider
    proxy.cluster.mode.command.move.enable=true
    proxy.cluster.mode.command.move.always=true
    cluster.mode.consensus.leader.selector.class.name=com.netease.nim.camellia.redis.proxy.cluster.provider.RedisConsensusLeaderSelector
    redis.consensus.leader.selector.redis.url=redis://@camellia-cluster-shared-auth-key-routing-consensus-redis:6379
    redis.consensus.leader.selector.redis.key=camellia:proxy:leader:shared-auth-key-routing:v1

    cport=16380
    cport.password=camellia_cport_pass
    console.port=16378
    netty.transport.mode=auto

    monitor.enable=true
    monitor.interval.seconds=10
    proxy.plugin.list=monitorPlugin,bigKeyPlugin,hotKeyPlugin

    dynamic.conf.reload.interval.seconds=2
    redis.conf.sharding.func=com.netease.nim.camellia.core.client.env.CRC16HashTagShardingFunc
    redis.conf.preheat=true
    redis.conf.close.idle.connection=true
    redis.conf.check.idle.connection.threshold.seconds=300
    redis.conf.close.idle.connection.delay.seconds=30

    route.conf.provider=multi_tenants_v1
    multi.tenant.route.default.bid=101
    multi.tenant.route.default.bgroup=prod
    multi.tenant.route.conf.reload.interval.millis=2000
    multi.tenant.route.conf.remove.enable=true

    svcOrderPwd.password.101.prod.route.conf={"type":"sharding","operation":{"bucketSize":3,"operationMap":{"0":{"read":"redis://@redis-pool-1:6379","type":"rw_separate","write":"redis://@redis-pool-1:6379"},"1":{"read":"redis://@redis-pool-2:6379","type":"rw_separate","write":"redis://@redis-pool-2:6379"},"2":{"read":"redis://@redis-pool-3:6379","type":"rw_separate","write":"redis://@redis-pool-3:6379"}}}}
    svcPaymentPwd.password.102.prod.route.conf={"type":"sharding","operation":{"bucketSize":3,"operationMap":{"0":{"read":"redis://@redis-pool-4:6379","type":"rw_separate","write":"redis://@redis-pool-4:6379"},"1":{"read":"redis://@redis-pool-5:6379","type":"rw_separate","write":"redis://@redis-pool-5:6379"},"2":{"read":"redis://@redis-pool-6:6379","type":"rw_separate","write":"redis://@redis-pool-6:6379"}}}}
    svcSearchPwd.password.103.prod.route.conf={"type":"sharding","operation":{"bucketSize":3,"operationMap":{"0":{"read":"redis://@redis-pool-7:6379","type":"rw_separate","write":"redis://@redis-pool-7:6379"},"1":{"read":"redis://@redis-pool-8:6379","type":"rw_separate","write":"redis://@redis-pool-8:6379"},"2":{"read":"redis://@redis-pool-9:6379","type":"rw_separate","write":"redis://@redis-pool-9:6379"}}}}

