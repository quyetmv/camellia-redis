apiVersion: v1
kind: ConfigMap
metadata:
  name: cm-db-camellia
data:
  logback.xml: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration scan="true" scanPeriod="60 seconds" debug="false">
      <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
        <encoder>
          <pattern>%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %thread %X %logger{36}:%L - %msg%n</pattern>
        </encoder>
      </appender>

      <logger name="com.netease.nim" level="INFO" additivity="false">
        <appender-ref ref="STDOUT" />
      </logger>
      <logger name="camellia.redis.proxy.stats" level="WARN" additivity="false">
        <appender-ref ref="STDOUT" />
      </logger>
      <logger name="com.netease.nim.camellia.redis.proxy.route.DefaultRouteConfProvider" level="WARN" additivity="false">
        <appender-ref ref="STDOUT" />
      </logger>
      <logger name="com.netease.nim.camellia.redis.proxy.route.RouteConfProvider" level="WARN" additivity="false">
        <appender-ref ref="STDOUT" />
      </logger>

      <!-- enable debug khi cần -->
      <!-- <logger name="com.netease.nim.camellia.redis.proxy" level="DEBUG"/> -->

      <root level="INFO">
        <appender-ref ref="STDOUT" />
      </root>
    </configuration>

  resource-sharding-singlewrite-multiread.json: |-
    {
      "type": "sharding",
      "operation": {
        "bucketSize": 3,
        "operationMap": {
          "0": {
            "read": {
              "resources": [
                "redis://@redis-pool-2:6379",
                "redis://@redis-pool-3:6379"
              ],
              "type": "random"
            },
            "type": "rw_separate",
            "write": "redis://@redis-pool-1:6379"
          },
          "1": {
            "read": {
              "resources": [
                "redis://@redis-pool-5:6379",
                "redis://@redis-pool-6:6379"
              ],
              "type": "random"
            },
            "type": "rw_separate",
            "write": "redis://@redis-pool-4:6379"
          },
          "2": {
            "read": {
              "resources": [
                "redis://@redis-pool-8:6379",
                "redis://@redis-pool-9:6379"
              ],
              "type": "random"
            },
            "type": "rw_separate",
            "write": "redis://@redis-pool-7:6379"
          }
        }
      }
    }

  resource-table.json: |-
    {
      "type": "sharding",
      "operation": {
        "bucketSize": 9,
        "operationMap": {
          "0": { "read": "redis://@redis-pool-1:6379", "type": "rw_separate", "write": "redis://@redis-pool-1:6379" },
          "1": { "read": "redis://@redis-pool-2:6379", "type": "rw_separate", "write": "redis://@redis-pool-2:6379" },
          "2": { "read": "redis://@redis-pool-3:6379", "type": "rw_separate", "write": "redis://@redis-pool-3:6379" },
          "3": { "read": "redis://@redis-pool-4:6379", "type": "rw_separate", "write": "redis://@redis-pool-4:6379" },
          "4": { "read": "redis://@redis-pool-5:6379", "type": "rw_separate", "write": "redis://@redis-pool-5:6379" },
          "5": { "read": "redis://@redis-pool-6:6379", "type": "rw_separate", "write": "redis://@redis-pool-6:6379" },
          "6": { "read": "redis://@redis-pool-7:6379", "type": "rw_separate", "write": "redis://@redis-pool-7:6379" },
          "7": { "read": "redis://@redis-pool-8:6379", "type": "rw_separate", "write": "redis://@redis-pool-8:6379" },
          "8": { "read": "redis://@redis-pool-9:6379", "type": "rw_separate", "write": "redis://@redis-pool-9:6379" }
        }
      }
    }

  resource-table-standalone-shared-auth-key-routing.json: |-
    {
      "type": "sharding",
      "operation": {
        "bucketSize": 2,
        "operationMap": {
          "0": {
            "read": "redis-sentinel://@10.10.86.142:26379,10.10.86.12:26379,10.10.86.121:26379/rs01?password=al892nsmbakVE0LUDXaCOvr5ds",
            "type": "rw_separate",
            "write": "redis-sentinel://@10.10.86.142:26379,10.10.86.12:26379,10.10.86.121:26379/rs01?password=al892nsmbakVE0LUDXaCOvr5ds"
          },
          "1": {
            "read": "redis-sentinel://@10.10.86.100:26379,10.10.87.246:26379,10.10.86.142:26379/rs02?password=al892nsmbakVE0aCOvr5ds",
            "type": "rw_separate",
            "write": "redis-sentinel://@10.10.86.100:26379,10.10.87.246:26379,10.10.86.142:26379/rs02?password=al892nsmbakVE0aCOvr5ds"
          }
        }
      }
    }

  resource-table-cluster-shared-auth-key-routing.json: |-
    {
      "type": "sharding",
      "operation": {
        "bucketSize": 9,
        "operationMap": {
          "0": { "read": "redis://@redis-pool-1:6379", "type": "rw_separate", "write": "redis://@redis-pool-1:6379" },
          "1": { "read": "redis://@redis-pool-2:6379", "type": "rw_separate", "write": "redis://@redis-pool-2:6379" },
          "2": { "read": "redis://@redis-pool-3:6379", "type": "rw_separate", "write": "redis://@redis-pool-3:6379" },
          "3": { "read": "redis://@redis-pool-4:6379", "type": "rw_separate", "write": "redis://@redis-pool-4:6379" },
          "4": { "read": "redis://@redis-pool-5:6379", "type": "rw_separate", "write": "redis://@redis-pool-5:6379" },
          "5": { "read": "redis://@redis-pool-6:6379", "type": "rw_separate", "write": "redis://@redis-pool-6:6379" },
          "6": { "read": "redis://@redis-pool-7:6379", "type": "rw_separate", "write": "redis://@redis-pool-7:6379" },
          "7": { "read": "redis://@redis-pool-8:6379", "type": "rw_separate", "write": "redis://@redis-pool-8:6379" },
          "8": { "read": "redis://@redis-pool-9:6379", "type": "rw_separate", "write": "redis://@redis-pool-9:6379" }
        }
      }
    }

  resource-service-order.json: |-
    {
      "type": "simple",
      "operation": {
        "read": {
          "resources": [
            "redis://@redis-pool-2:6379",
            "redis://@redis-pool-3:6379"
          ],
          "type": "random"
        },
        "type": "rw_separate",
        "write": "redis://@redis-pool-1:6379"
      }
    }

  resource-service-payment.json: |-
    {
      "type": "simple",
      "operation": {
        "read": {
          "resources": [
            "redis://@redis-pool-5:6379",
            "redis://@redis-pool-6:6379"
          ],
          "type": "random"
        },
        "type": "rw_separate",
        "write": "redis://@redis-pool-4:6379"
