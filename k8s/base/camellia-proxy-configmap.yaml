  resource-service-search.json: |-
    {
      "type": "simple",
      "operation": {
        "read": {
          "resources": [
            "redis://@redis-pool-8:6379",
            "redis://@redis-pool-9:6379"
          ],
          "type": "random"
        },
        "type": "rw_separate",
        "write": "redis://@redis-pool-7:6379"
      }
