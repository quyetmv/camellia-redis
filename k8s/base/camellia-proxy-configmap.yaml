  # ======================
  # STANDALONE + SHARDING
  # ======================
  camellia-redis-proxy-standalone-shared-auth.properties: |-
    port=6380
    application.name=camellia-redis-proxy-shared-auth
    proxy.mode=standalone
    netty.transport.mode=auto

    monitor.enable=true
    monitor.interval.seconds=10
    console.port=16379
    proxy.plugin.list=monitorPlugin,bigKeyPlugin,hotKeyPlugin

    dynamic.conf.reload.interval.seconds=30

    route.conf.provider=multi_tenants_v1
    multi.tenant.route.default.bid=101
    multi.tenant.route.default.bgroup=prod
    multi.tenant.route.conf.reload.interval.millis=2000
    multi.tenant.route.conf.remove.enable=true

    order-service.password.101.prod.route.conf={"type":"sharding","operation":{"bucketSize":3,"operationMap":{"0":{"read":"redis://@redis-pool-1:6379","type":"rw_separate","write":"redis://@redis-pool-1:6379"},"1":{"read":"redis://@redis-pool-2:6379","type":"rw_separate","write":"redis://@redis-pool-2:6379"},"2":{"read":"redis://@redis-pool-3:6379","type":"rw_separate","write":"redis://@redis-pool-3:6379"}}}}
    payment-service.password.102.prod.route.conf={"type":"sharding","operation":{"bucketSize":3,"operationMap":{"0":{"read":"redis://@redis-pool-4:6379","type":"rw_separate","write":"redis://@redis-pool-4:6379"},"1":{"read":"redis://@redis-pool-5:6379","type":"rw_separate","write":"redis://@redis-pool-5:6379"},"2":{"read":"redis://@redis-pool-6:6379","type":"rw_separate","write":"redis://@redis-pool-6:6379"}}}}
    search-service.password.103.prod.route.conf={"type":"sharding","operation":{"bucketSize":3,"operationMap":{"0":{"read":"redis://@redis-pool-7:6379","type":"rw_separate","write":"redis://@redis-pool-7:6379"},"1":{"read":"redis://@redis-pool-8:6379","type":"rw_separate","write":"redis://@redis-pool-8:6379"},"2":{"read":"redis://@redis-pool-9:6379","type":"rw_separate","write":"redis://@redis-pool-9:6379"}}}}

  # ======================
  # STANDALONE - SHARED AUTH + KEY ROUTING
  # mỗi service auth bằng password riêng; key routing theo hash/tag trong từng tenant route
  # ======================
  camellia-redis-proxy-standalone-shared-auth-key-routing.properties: |-
    port=6380
    application.name=camellia-redis-proxy-standalone-shared-auth-key-routing
    proxy.mode=standalone
    netty.transport.mode=auto

    monitor.enable=true
    monitor.interval.seconds=10
    console.port=16379
    proxy.plugin.list=monitorPlugin,bigKeyPlugin,hotKeyPlugin

    dynamic.conf.reload.interval.seconds=30
    redis.conf.sharding.func=com.netease.nim.camellia.core.client.env.CRC16HashTagShardingFunc
    redis.conf.preheat=true
    redis.conf.close.idle.connection=true
    redis.conf.check.idle.connection.threshold.seconds=300
    redis.conf.close.idle.connection.delay.seconds=30
    route.conf.provider=multi_tenants_v1
    multi.tenant.route.default.bid=100
    multi.tenant.route.default.bgroup=default
    multi.tenant.route.conf.reload.interval.millis=2000
    multi.tenant.route.conf.remove.enable=true
    proxy.key.converter.class.name=com.netease.nim.camellia.redis.proxy.conf.DefaultMultiTenantNamespaceKeyConverter

    camellia_default_2026.password.100.default.route.conf={"type":"sharding","operation":{"bucketSize":2,"operationMap":{"0":{"read":"redis-sentinel://al892nsmbakVE0LUDXaCOvr5ds@10.10.86.142:26379,10.10.87.246:26379,10.10.87.229:26379/rs01","type":"rw_separate","write":"redis-sentinel://al892nsmbakVE0LUDXaCOvr5ds@10.10.86.142:26379,10.10.87.246:26379,10.10.87.229:26379/rs01"},"1":{"read":"redis-sentinel://al892nsmbakVE0aCOvr5ds@10.10.86.121:26379,10.10.86.12:26379,10.10.86.118:26379/rs02","type":"rw_separate","write":"redis-sentinel://al892nsmbakVE0aCOvr5ds@10.10.86.121:26379,10.10.86.12:26379,10.10.86.118:26379/rs02"}}}}
    xteam_pass_2026.password.101.default.route.conf={"type":"sharding","operation":{"bucketSize":2,"operationMap":{"0":{"read":"redis-sentinel://al892nsmbakVE0LUDXaCOvr5ds@10.10.86.142:26379,10.10.87.246:26379,10.10.87.229:26379/rs01","type":"rw_separate","write":"redis-sentinel://al892nsmbakVE0LUDXaCOvr5ds@10.10.86.142:26379,10.10.87.246:26379,10.10.87.229:26379/rs01"},"1":{"read":"redis-sentinel://al892nsmbakVE0aCOvr5ds@10.10.86.121:26379,10.10.86.12:26379,10.10.86.118:26379/rs02","type":"rw_separate","write":"redis-sentinel://al892nsmbakVE0aCOvr5ds@10.10.86.121:26379,10.10.86.12:26379,10.10.86.118:26379/rs02"}}}}
    payment_pass_2026.password.102.default.route.conf={"type":"sharding","operation":{"bucketSize":2,"operationMap":{"0":{"read":"redis-sentinel://al892nsmbakVE0LUDXaCOvr5ds@10.10.86.142:26379,10.10.87.246:26379,10.10.87.229:26379/rs01","type":"rw_separate","write":"redis-sentinel://al892nsmbakVE0LUDXaCOvr5ds@10.10.86.142:26379,10.10.87.246:26379,10.10.87.229:26379/rs01"},"1":{"read":"redis-sentinel://al892nsmbakVE0aCOvr5ds@10.10.86.121:26379,10.10.86.12:26379,10.10.86.118:26379/rs02","type":"rw_separate","write":"redis-sentinel://al892nsmbakVE0aCOvr5ds@10.10.86.121:26379,10.10.86.12:26379,10.10.86.118:26379/rs02"}}}}
    search_pass_2026.password.103.default.route.conf={"type":"sharding","operation":{"bucketSize":2,"operationMap":{"0":{"read":"redis-sentinel://al892nsmbakVE0LUDXaCOvr5ds@10.10.86.142:26379,10.10.87.246:26379,10.10.87.229:26379/rs01","type":"rw_separate","write":"redis-sentinel://al892nsmbakVE0LUDXaCOvr5ds@10.10.86.142:26379,10.10.87.246:26379,10.10.87.229:26379/rs01"},"1":{"read":"redis-sentinel://al892nsmbakVE0aCOvr5ds@10.10.86.121:26379,10.10.86.12:26379,10.10.86.118:26379/rs02","type":"rw_separate","write":"redis-sentinel://al892nsmbakVE0aCOvr5ds@10.10.86.121:26379,10.10.86.12:26379,10.10.86.118:26379/rs02"}}}}
    
  camellia-redis-proxy-standalone.properties: |-
    port=6380
    application.name=camellia-redis-proxy-standalone
    proxy.mode=standalone
    console.port=16379
    password=camellia_admin_pass
    netty.transport.mode=auto

    monitor.enable=true
    monitor.interval.seconds=10
    proxy.plugin.list=monitorPlugin,bigKeyPlugin,hotKeyPlugin,hotKeyCachePlugin
    dynamic.conf.reload.interval.seconds=30
    route.conf.file=resource-sharding-singlewrite-multiread.json

    transpond.type=local
    transpond.local.type=complex
    transpond.local.json.file=resource-sharding-singlewrite-multiread.json
    redis.conf.sharding.func=com.netease.nim.camellia.core.client.env.CRC16HashTagShardingFunc
    redis.conf.preheat=true
    redis.conf.close.idle.connection=true
    redis.conf.check.idle.connection.threshold.seconds=300
    redis.conf.close.idle.connection.delay.seconds=30

  # ======================
  # CLUSTER - GENERIC
  # ======================
  camellia-redis-proxy-cluster.properties: |-
    port=6380
    application.name=camellia-redis-proxy-server
    proxy.mode=cluster
    proxy.cluster.mode.enable=true
    cluster.mode.provider.class.name=com.netease.nim.camellia.redis.proxy.cluster.provider.ConsensusClusterModeProvider
    proxy.cluster.mode.command.move.enable=false
    proxy.cluster.mode.command.move.always=false
    cluster.mode.consensus.leader.selector.class.name=com.netease.nim.camellia.redis.proxy.cluster.provider.RedisConsensusLeaderSelector
    redis.consensus.leader.selector.redis.url=redis://@10.10.84.78:6379
    redis.consensus.leader.selector.redis.key=camellia:proxy:leader:main:v1

    cport=16380
    cport.password=camellia_cport_pass
    console.port=16378
    password=camellia_admin_pass
    netty.transport.mode=auto

    monitor.enable=true
    monitor.interval.seconds=60
    proxy.plugin.list=monitorPlugin,bigKeyPlugin,hotKeyPlugin,hotKeyCachePlugin

    # transpond local+sharding-singlewrite-multiread
    transpond.type=local
    transpond.local.type=complex
    transpond.local.json.file=resource-sharding-singlewrite-multiread.json

    redis.conf.sharding.func=com.netease.nim.camellia.core.client.env.CRC16HashTagShardingFunc
    redis.conf.redis.cluster.max.attempts=5
    redis.conf.close.idle.connection=true
    redis.conf.check.idle.connection.threshold.seconds=600
    redis.conf.close.idle.connection.delay.seconds=60
    redis.conf.preheat=true
    redis.conf.heartbeat.interval.seconds=60
    redis.conf.heartbeat.timeout.millis=10000
    redis.conf.connect.timeout.millis=1000
    redis.conf.fail.count.threshold=5
    redis.conf.fail.ban.millis=5000

  # ======================
  # CLUSTER - KEY ROUTING
  # ======================
  camellia-redis-proxy-cluster-key-routing.properties: |-
    port=6380
    application.name=camellia-redis-proxy-cluster-key-routing
    password=camellia_admin_pass
    proxy.mode=cluster
    proxy.cluster.mode.enable=true
    cluster.mode.provider.class.name=com.netease.nim.camellia.redis.proxy.cluster.provider.ConsensusClusterModeProvider
    proxy.cluster.mode.command.move.enable=true
    proxy.cluster.mode.command.move.always=true
    cluster.mode.consensus.leader.selector.class.name=com.netease.nim.camellia.redis.proxy.cluster.provider.RedisConsensusLeaderSelector
