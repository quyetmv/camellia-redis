apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-db-camellia
  labels:
    app: camellia-proxy-sts
spec:
  replicas: 1
  serviceName: svc-db-camellia
  selector:
    matchLabels:
      app: camellia-proxy-sts
  template:
    metadata:
      labels:
        app: camellia-proxy-sts
    spec:
      enableServiceLinks: false
      containers:
        - name: container-camellia
          image: 48n6e/camellia-redis-proxy:1.4.0-jdk-21-0.0.1
          command:
            - java
            - "-XX:+UseG1GC"
            - "-XX:+UseContainerSupport"
            - "-Dio.netty.tryReflectionSetAccessible=true"
            - "--add-opens"
            - "java.base/java.lang=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.io=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.math=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.net=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.nio=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.security=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.text=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.time=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/java.util=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/jdk.internal.access=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/jdk.internal.misc=ALL-UNNAMED"
            - "--add-opens"
            - "java.base/sun.net.util=ALL-UNNAMED"
            - "-Xms128m"
            - "-Xmx1024m"
            - "-server"
            - "org.springframework.boot.loader.launch.JarLauncher"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          ports:
            - containerPort: 6380
              name: redis
              protocol: TCP
            - containerPort: 16379
              name: console
              protocol: TCP
          volumeMounts:
            - name: cm-db-camellia
              mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/application.yml
              subPath: application.yml
            - name: cm-db-camellia
              mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/logback.xml
              subPath: logback.xml
            - name: cm-db-camellia
              mountPath: /opt/camellia-redis-proxy/BOOT-INF/classes/resource-sharding-singlewrite-multiread.json
              subPath: resource-sharding-singlewrite-multiread.json
      volumes:
        - name: cm-db-camellia
          configMap:
            name: cm-db-camellia
