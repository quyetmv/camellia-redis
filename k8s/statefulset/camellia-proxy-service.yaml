apiVersion: v1
kind: Service
metadata:
  name: svc-db-camellia
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "16379"
    prometheus.io/path: "/prometheus"
spec:
  type: NodePort
  ports:
    - name: redis
      protocol: TCP
      port: 6380
      targetPort: 6380
      nodePort: 30380
    - name: console
      protocol: TCP
      port: 16379
      targetPort: 16379
      nodePort: 30379
  selector:
    app: camellia-proxy-sts
