apiVersion: apps/v1
kind: Deployment
metadata:
  name: camellia-test-runner
  labels:
    app: camellia-test-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camellia-test-runner
  template:
    metadata:
      labels:
        app: camellia-test-runner
    spec:
      containers:
        - name: runner
          image: quyetmv/camellia-test-runner:local
          imagePullPolicy: Always
          command: ["python", "-u", "/app/run-tests.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: TEST_SCENARIO
              value: both
            - name: KEY_ROUTING_HOST_CLUSTER
              value: svc-camellia-proxy-cluster-key-routing
            - name: SHARED_AUTH_HOST_CLUSTER
              value: svc-camellia-proxy-cluster-shared-auth
            - name: KEY_ROUTING_PORT_CLUSTER
              value: "6380"
            - name: SHARED_AUTH_PORT_CLUSTER
              value: "6380"
            - name: KEY_ROUTING_HOST_STANDALONE
              value: svc-camellia-proxy-standalone-key-routing
            - name: SHARED_AUTH_HOST_STANDALONE
              value: svc-camellia-proxy-standalone-shared-auth
            - name: KEY_ROUTING_PORT_STANDALONE
              value: "6380"
            - name: SHARED_AUTH_PORT_STANDALONE
              value: "6380"
            - name: ADMIN_PASSWORD
              value: camellia_admin_pass
            - name: ORDER_PASSWORD
              value: svcOrderPwd
            - name: PAYMENT_PASSWORD
              value: svcPaymentPwd
            - name: SEARCH_PASSWORD
              value: svcSearchPwd
            - name: ORDER_SERVICE_PREFIX
              value: svc:order
            - name: PAYMENT_SERVICE_PREFIX
              value: svc:payment
            - name: SEARCH_SERVICE_PREFIX
              value: svc:search
            - name: HOT_KEY_NAME
              value: session:{hot-user}:profile
            - name: STRESS_CLIENTS
              value: "24"
            - name: STRESS_REQUESTS_PER_CLIENT
              value: "2000"
            - name: SET_PERCENT
              value: "30"
            - name: GET_PERCENT
              value: "70"
            - name: HOT_KEY_PERCENT
              value: "20"
            - name: HOT_KEY_COUNT
              value: "8"
            - name: KEYSPACE
              value: "50000"
            - name: VALUE_SIZE
              value: "128"
            - name: REPORT_EVERY
              value: "500"
            - name: SCENARIO_DELAY_SECONDS
              value: "3"
            - name: RUN_FOREVER
              value: "true"
            - name: RUN_INTERVAL_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
