apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: camellia-proxy
  labels:
    app.kubernetes.io/name: camellia-proxy
spec:
  selector:
    matchLabels:
      monitoring.camellia.io/enabled: "true"
  endpoints:
    - port: console
      path: /prometheus
      scheme: http
      interval: 15s
      scrapeTimeout: 10s
