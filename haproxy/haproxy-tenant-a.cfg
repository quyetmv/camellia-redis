global
  log stdout format raw local0
  maxconn 8192

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 2m
  timeout server 2m

frontend redis_front_tenant_a
  bind *:6379
  default_backend camellia_proxies_tenant_a

backend camellia_proxies_tenant_a
  balance roundrobin
  option tcp-check
  server proxy_a_1 camellia-proxy-tenant-a-1:6380 check
  server proxy_a_2 camellia-proxy-tenant-a-2:6380 check
  server proxy_a_3 camellia-proxy-tenant-a-3:6380 check
  server proxy_a_4 camellia-proxy-tenant-a-4:6380 check
  server proxy_a_5 camellia-proxy-tenant-a-5:6380 check
  server proxy_a_6 camellia-proxy-tenant-a-6:6380 check
